<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Investimentos Manual">
  <!-- Solid teal tile (matches the app accent, no gradient) -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0E6B7C"/>
  <!-- Baseline -->
  <line x1="56" y1="186" x2="200" y2="186" stroke="#7FD3DF" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <!-- Ascending line chart -->
  <polyline points="56,170 100,140 132,154 178,86"
            fill="none" stroke="#FFFFFF" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead at the peak -->
  <polyline points="150,84 178,84 178,112"
            fill="none" stroke="#FFFFFF" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points -->
  <circle cx="56" cy="170" r="9" fill="#FFFFFF"/>
  <circle cx="100" cy="140" r="9" fill="#FFFFFF"/>
  <circle cx="132" cy="154" r="9" fill="#FFFFFF"/>
</svg>
