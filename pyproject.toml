[project]
name = "investimentos-manual"
version = "0.3.0"
description = "Portfolio + 3-prompt monthly research cycle. Fully local (FastAPI + SQLite + Next.js)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
